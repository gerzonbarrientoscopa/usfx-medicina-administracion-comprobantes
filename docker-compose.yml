name: sistemasusfx

services:  
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: usfx_comprobantes_backend
    restart: unless-stopped   
    env_file:
      - ./backend/.env     
    ports:
      - "8001:8001"
    networks:
      - redportales

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BASE_PATH: ${REACT_APP_BASE_PATH:-/comprobantes}
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-/comprobantes}
    container_name: usfx_comprobantes_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - redportales


networks:
  redportales:
    name: si3-network
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.20.0/24"
          gateway: "192.168.20.1"