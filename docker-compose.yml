services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      SQLSERVER_HOST: "${SQLSERVER_HOST:-172.16.1.250,1433}"
      SQLSERVER_DATABASE: "${SQLSERVER_DATABASE:-ComprobantesDB}"
      SQLSERVER_USER: "${SQLSERVER_USER:-usrweb_comprobantes}"
      SQLSERVER_PASSWORD: "${SQLSERVER_PASSWORD:-}"
      SQLSERVER_DRIVER: "${SQLSERVER_DRIVER:-{ODBC Driver 17 for SQL Server}}"
      SQLSERVER_CONNECTION_STRING: "${SQLSERVER_CONNECTION_STRING:-}"
      SQLSERVER_TRUSTED_AUTH: "${SQLSERVER_TRUSTED_AUTH:-false}"
      JWT_SECRET: "${JWT_SECRET:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}"
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BASE_PATH: "${REACT_APP_BASE_PATH:-/}"
        REACT_APP_BACKEND_URL: "${REACT_APP_BACKEND_URL:-http://localhost:8002}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
